; Copy to config.ini and fill in real values. config.ini is git-ignored.
; Environment variables (DB_*, SAP_*, APP_ENV) override these values - see README.md.

[environment]
current_env = development
log_level = INFO
log_file_prefix = log
log_extension = txt
; Log folder; relative paths are created under the server's current working directory
log_dir = log
; One file per day (log_YYYYMMDD.txt); older files are deleted after this many days
log_retention_days = 30

[development]
ec2_ip = <postgres-host>
port = 5433
db_name = <database>
db_user = <db-user>
db_password = <db-password>
region_name = us-east-1
suffix_db = -DEV

[production]
ec2_ip = <postgres-host>
port = 5432
db_name = <database>
db_user = <db-user>
db_password = <db-password>
region_name = ap-south-1
suffix_db =

[auth]
; Comma-separated API keys accepted in the X-API-Key header (env var API_KEYS overrides).
; Generate one with: python -c "import secrets; print(secrets.token_urlsafe(32))"
; If empty, /api/bank/* endpoints answer 503 (fail closed).
api_keys = <api-key-1>,<api-key-2>

[defaults]
tenant_id = <tenant-id>
org_id = <org-id>

[sap]
host = <sap-host>
port = 44343
client = 200
user = <sap-user>
password = <sap-password>
service_name = ZGENERIC_DATA_SRV
use_https = true
verify_ssl = false
timeout = 90
max_retries = 3
batch_size = 1000
; SAP tables used to validate bank files: BSID (always), BSAD, KNA1, KNB1.
; Other names are skipped and listed under "sap_tables.ignored" in the response.
tables = BSID,BSAD

[bank_posting]
; RFC function module that posts bank receipts with clearing (called via /sap/bc/soap/rfc)
rfc_function = Z_BANK_POST_CLEAR
; Connection clearing (POST /api/clearing/post): one bank receipt clears several invoices
clearing_rfc_function = Z_BANK_POST_CLEAR_MULTI
; Column in public.active_cnx that receives the SAP clearing document number
cnx_clearing_column = clearingdocid
; Default match field for clearing: BELNR = SAP document number from active_bt3i.documentid
clearing_match_by = BELNR
; New customer invoices (POST /api/invoice/post): RFC function and SAP document type
invoice_rfc_function = Z_INVOICE_POST
invoice_doc_type = DR
default_doc_type = DZ
; Field used to find the open invoice in SAP: XBLNR | ZUONR | BELNR
default_match_by = XBLNR
; Validate against live SAP BSID before posting
check_open_items = true
; Tenant Excel files in S3 (used when the request has tenant_id):
;   {tenant_id} lower-cased, {suffix_s3} from the active env section, {path} = file_path without drive
;   {dir} = folder part of the path, {name} = file name  (C:\SAP\BANK.xlsx -> SAP/<org_id>/BANK.xlsx)
s3_bucket_template = dt-{tenant_id}{suffix_s3}
s3_key_template = {dir}/{org_id}/{name}

; ---------------------------------------------------------------------------
; Per-organisation SAP values (org_id = active_bt3i / active_cnx orgid).
; Used when the request and the Excel file leave the field out:
;   request value > Excel column > [org:<org_id>]
; ---------------------------------------------------------------------------
[org:OM0000000001]
company_code = DAT1
currency = INR
; POST /api/invoice/post: revenue G/L and tax code (empty = no tax)
gl_account = 40400000
tax_code =
; POST /api/clearing/post: bank G/L; true = send value_date = posting_date
; (needed for bank G/Ls whose field status requires a value date, e.g. G005)
bank_gl = 24520000
value_date_required = true
; house bank (HBKID) and account ID (HKTID), when the bank G/L's field status requires them,
; e.g. DPDL receipt G/L 10601012: house_bank = SBIDL, house_bank_account = SBIM
;house_bank =
;house_bank_account =

; DataTwin customer name (active_bt3i.sendername / active_cnx.customername) = SAP customer number.
; Case and extra spaces are ignored. A request "customer" value always wins.
[customers:OM0000000001]
TEST Customer_02 TEST02 = 30000001
