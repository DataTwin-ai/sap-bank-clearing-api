[sap]
host = 183.83.196.74
port = 44343
client = 200
user = 432USER027
password = OneIntegral@2030$
service_name = ZGENERIC_DATA_SRV
use_https = true
verify_ssl = false
timeout = 90
max_retries = 3
batch_size = 1000

# Comma-separated list of SAP tables/views to extract in FULL dynamically.
# Add any SAP table here (e.g., BSID, KNA1, BKPF, T001, BSIK, BSEG, ACDOCA).
tables = BSID

# 0 = Unlimited (extracts all rows via OData pagination without truncation)
default_max_rows = 0
default_db_mode = replace
save_csv = true
strict_live = true

# Downstream ingestion triggers executed automatically after DB insert completes
run_bt3i_sync = true
# Optional external ingestion script/command to call after DB load (e.g. python scripts/ingest.py)
ingestion_script =
fail_fast = true


[bank_posting]
# RFC function module that posts bank receipts with clearing (called via /sap/bc/soap/rfc)
# Source: bank_posting/sap_abap/Z_BANK_POST_CLEAR.abap
rfc_function = Z_BANK_POST_CLEAR
default_doc_type = DZ
# Field used to find the open invoice in SAP: XBLNR (reference) | ZUONR (assignment) | BELNR (doc no)
default_match_by = XBLNR
# Validate against live SAP BSID before posting
check_open_items = true
; Tenant Excel files in S3 (used when the request has tenant_id):
;   {tenant_id} lower-cased, {suffix_s3} from the active env section, {path} = file_path without drive
;   {dir} = folder part of the path, {name} = file name  (C:\SAP\BANK.xlsx -> SAP/<org_id>/BANK.xlsx)
s3_bucket_template = dt-{tenant_id}{suffix_s3}
s3_key_template = {dir}/{org_id}/{name}

[auth]
; Comma-separated API keys accepted in the X-API-Key header (env var API_KEYS overrides)
api_keys = SAP_Datatwin_123
