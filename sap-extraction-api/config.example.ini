; SAP Extraction service configuration
; Copy to config.ini (same folder) or point SAP_EXTRACTION_CONFIG=/path/to/config.ini.
; Every value can also come from the environment variable shown as (ENV_NAME);
; environment variables win over this file.
; Relative paths are resolved against the project folder.
; Keep comments on their own lines (no comments after a value).

[environment]
; DB section below to use (APP_ENV)
current_env = production

; DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD override these
[development]
ec2_ip = <dev-db-host>
port = 5433
db_name = dm00005
db_user = postgres
db_password = <dev-db-password>

[production]
ec2_ip = <prod-db-host>
port = 5432
db_name = dm00005
db_user = postgres
db_password = <prod-db-password>

[defaults]
; (TENANT_ID)
tenant_id = DM00005
; (ORG_ID)
org_id = OM0000000001

; Org of the SAP data for ingestion and new passportids, when it differs from [defaults] org_id
[sync]
; (SYNC_ORG_ID)
org_id = OM0000000002

; SAP_HOST, SAP_PORT, SAP_CLIENT, SAP_USER, SAP_PASSWORD, SAP_SERVICE_NAME,
; SAP_USE_HTTPS, SAP_VERIFY_SSL, SAP_TIMEOUT, SAP_MAX_RETRIES, SAP_BATCH_SIZE override these
[sap]
host = <sap-host>
port = 44343
client = 200
user = <sap-user>
password = <sap-password>
service_name = ZGENERIC_DATA_SRV
use_https = true
verify_ssl = false
; seconds per OData call
timeout = 90
max_retries = 3
; rows per OData page
batch_size = 1000

; Full-load tables for `cli.py sync` and /api/sync-config, comma separated (SAP_TABLES).
; Tables in [delta] tables are skipped here (they are synced every minute instead).
tables = KNA1
; 0 = all rows (SAP_DEFAULT_MAX_ROWS)
default_max_rows = 0
; replace = drop + reload active_<table>; append = add new rows only (SAP_DEFAULT_DB_MODE)
default_db_mode = replace
; Stop at the first failing table (SAP_FAIL_FAST)
fail_fast = true
; After BSID loads, copy open invoices active_bsid -> active_bt3h directly (SAP_RUN_BT3I_SYNC).
; Fallback only: the delta worker + ingestion API is the normal path. Keep false when it runs.
run_bt3i_sync = false
; Optional command run after a successful sync, in the project folder (SAP_INGESTION_SCRIPT)
; e.g.  ingestion_script = scripts/ingest.py --full
ingestion_script =
; seconds (SAP_INGESTION_TIMEOUT)
ingestion_timeout = 1800
; Write data/exports/<table>_latest.csv + dated copies (SAP_SAVE_CSV)
save_csv = false
; Dated CSV copies older than this are deleted (SAP_CSV_RETENTION_DAYS)
csv_retention_days = 7

; Delta sync: tables polled every poll_seconds; only new / changed rows go to ingestion.
; A table listed here is excluded from the full-load [sap] tables / /api/extract.
; First time per table:  python cli.py delta-init BSID   (then BSAD, VBRK, VBRP)
; New table: delta-init it, add it here, add its [ingestion] *_<table> keys.
[delta]
; (DELTA_TABLES) Ingested in this order each cycle: keep a header table (VBRK) before its items (VBRP).
tables = BSID, BSAD, VBRK, VBRP
; (DELTA_POLL_SECONDS)
poll_seconds = 60
; Polls a row must be missing from SAP before it is marked REMOVED (DELTA_MISSING_POLLS)
missing_polls_before_removed = 2
; passportid = <prefix><org last 2><FY><7-digit seq> (DELTA_PASSPORT_PREFIX)
passport_prefix = PPSAP

; Data Modelling & Ingestion API that receives the new rows (POST /api/ingest/table)
[ingestion]
; (INGESTION_ENABLED)
enabled = true
; (INGESTION_BASE_URL) must be reachable from this server and accept process_code / theme_name
base_url = https://lv.datatwin.ai/data-model-ingestion
; Source DB name sent to the API; empty = DB name of the active environment (INGESTION_DB)
db =
; Max rows per ingestion run (INGESTION_BATCH_SIZE)
batch_size = 5000
; Seconds between job status checks (INGESTION_JOB_POLL_SECONDS)
job_poll_seconds = 10
; A run still not finished after this is FAILED and its rows re-queued (INGESTION_JOB_TIMEOUT_MINUTES)
job_timeout_minutes = 30
; HTTP timeout of the submit call in seconds (INGESTION_REQUEST_TIMEOUT)
request_timeout = 120
; Failed attempts before a row is parked as FAILED (INGESTION_MAX_RETRIES)
max_retries = 3
; Target process per delta table, so the ingestion API skips AI classification
; (otherwise SAP BSID is classified as GLE). Key = <name>_<table lower case>.
; (INGESTION_PROCESS_CODE_BSID, INGESTION_TRANSACTION_TYPE_BSID, INGESTION_THEME_NAME_BSID)
; Nothing is sent while the ingestion service does not accept these fields (rows stay PENDING).
process_code_bsid = BT3H
transaction_type_bsid = Invoice
; Pinned theme in theme_mapping (deploy/sql/bt3h_sap_themes.sql); a missing theme fails the run.
; Empty = automatic AI theme (not recommended).
theme_name_bsid = SAP_BSID_INV
; Columns sent to ingestion (passportid is always added). The ingestion service adds every
; unmapped column to the target table, so keep this to what the target needs. Empty = all ~210 columns.
; "column as name" renames a column in the staging table (e.g. bukrs_ana as bukrs).
columns_bsid = bukrs, kunnr, belnr, gjahr, buzei, blart, bldat, budat, cpudt, xblnr, zuonr, waers, dmbtr, wrbtr, shkzg, zfbdt, zterm, zbd1t, sgtxt, xref1, xref2, xref3, augdt, augbl, gsber, hkont, mwskz
; BSAD = cleared customer items -> active_bt3h CUSTOMER_ACCOUNT
process_code_bsad = BT3H
transaction_type_bsad = CUSTOMER_ACCOUNT
theme_name_bsad = SAP_BSAD_CA
columns_bsad = bukrs, kunnr, belnr, gjahr, buzei, blart, bldat, budat, cpudt, xblnr, zuonr, waers, dmbtr, wrbtr, shkzg, zfbdt, zterm, zbd1t, sgtxt, xref1, xref2, xref3, augdt, augbl, gsber, hkont, mwskz
; VBRK = billing document header -> active_bt3h, VBRP = billing items -> active_bt3i (SalesInvoice).
; Both keyed by documentnumber = vbeln; header and items share one context ID.
; Themes SAP_VBRK_SI / SAP_VBRP_SI: deploy/sql/sales_invoice_themes.sql
process_code_vbrk = BT3H
transaction_type_vbrk = SalesInvoice
theme_name_vbrk = SAP_VBRK_SI
columns_vbrk = vbeln, fkart, fkdat, bukrs, gjahr, belnr, xblnr, kunag, kunrg, vkorg, vtweg, waerk, kurrf, netwr, mwsbk, zterm, rfbsk, fksto, sfakn
process_code_vbrp = BT3I
transaction_type_vbrp = SalesInvoice
theme_name_vbrp = SAP_VBRP_SI
columns_vbrp = vbeln, posnr, fkdat_ana as fkdat, bukrs_ana as bukrs, kunrg_ana as kunrg, kunag_ana as kunag, matnr, arktx, matkl, fkimg, vrkme, netwr, mwsbp, mwsk1, waerk, werks, aubel, aupos, vgbel, vgpos, pstyv, shkzg
; Optional extra fields for the API (INGESTION_PRODUCT_NAME, INGESTION_USER_ID, INGESTION_SAVE_LOCATION)
product_name =
user_id =
save_location =

[api]
; Required header X-API-Key on /api/*; leave empty only on a private network (API_KEY)
api_key =
; URL prefix when served behind nginx, e.g. /sap/extract (ROOT_PATH)
root_path =
; Used by `python main.py` (API_HOST, API_PORT)
host = 127.0.0.1
port = 8002

[paths]
; (LOG_DIR)
log_dir = log
; Lock file + CSV exports (DATA_DIR)
data_dir = data

[logging]
; (LOG_LEVEL)
level = INFO
; log/api.log and log/cron.log, rotated at midnight (LOG_TO_FILE)
log_to_file = true
; (LOG_RETENTION_DAYS)
retention_days = 30
