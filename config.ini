[defaults]
process = Data Modelling & Ingestion
product_name = DTFOWS
tenant_id = DM00005
org_id = OM0000000001
data_key = data/BSID_VIEW.xlsx
transaction_id = TR_CUSAT_AUDITED_BOOKS_2223
