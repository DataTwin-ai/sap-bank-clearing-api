# =============================================================================
# nginx: https://demo.datatwin.ai/sap/bank  ->  sap-bank-clearing-api container
#
# This is a location snippet, NOT a full server block.
# Install on the EC2 host:
#   sudo cp sap-bank.conf /etc/nginx/snippets/sap-bank.conf
# then add this line inside the existing `server { ... }` block for
# demo.datatwin.ai (the one with `listen 443 ssl`):
#   include /etc/nginx/snippets/sap-bank.conf;
# and reload:
#   sudo nginx -t && sudo systemctl reload nginx
#
# The container listens on 127.0.0.1:8000 and is started with
# ROOT_PATH=/sap/bank, so Swagger (/sap/bank/docs) and redirects keep the prefix.
# =============================================================================

# /sap/bank -> /sap/bank/
location = /sap/bank {
    return 301 /sap/bank/;
}

location /sap/bank/ {
    # Trailing slash strips the /sap/bank prefix before passing to the app
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /sap/bank;

    # SAP posting + clearing for a batch can take a while
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    client_max_body_size 20m;
}
