; Copy to config.ini and fill in real values. config.ini is git-ignored.
; Environment variables (DB_*, SAP_*, APP_ENV) override these values - see README.md.

[environment]
current_env = development
log_level = INFO
log_file_prefix = log
log_extension = txt
; Log folder; relative paths are created under the server's current working directory
log_dir = log

[development]
ec2_ip = <postgres-host>
port = 5433
db_name = <database>
db_user = <db-user>
db_password = <db-password>
region_name = us-east-1
suffix_db = -DEV

[production]
ec2_ip = <postgres-host>
port = 5432
db_name = <database>
db_user = <db-user>
db_password = <db-password>
region_name = ap-south-1
suffix_db =

[auth]
; Comma-separated API keys accepted in the X-API-Key header (env var API_KEYS overrides).
; Generate one with: python -c "import secrets; print(secrets.token_urlsafe(32))"
; If empty, /api/bank/* endpoints answer 503 (fail closed).
api_keys = <api-key-1>,<api-key-2>

[defaults]
tenant_id = <tenant-id>
org_id = <org-id>

[sap]
host = <sap-host>
port = 44343
client = 200
user = <sap-user>
password = <sap-password>
service_name = ZGENERIC_DATA_SRV
use_https = true
verify_ssl = false
timeout = 90
max_retries = 3
batch_size = 1000

[bank_posting]
; RFC function module that posts bank receipts with clearing (called via /sap/bc/soap/rfc)
rfc_function = Z_BANK_POST_CLEAR
default_doc_type = DZ
; Field used to find the open invoice in SAP: XBLNR | ZUONR | BELNR
default_match_by = XBLNR
; Validate against live SAP BSID before posting
check_open_items = true
; Tenant Excel files in S3 (used when the request has tenant_id):
;   {tenant_id} lower-cased, {suffix_s3} from the active env section, {path} = file_path without drive
;   {dir} = folder part of the path, {name} = file name  (C:\SAP\BANK.xlsx -> SAP/<org_id>/BANK.xlsx)
s3_bucket_template = dt-{tenant_id}{suffix_s3}
s3_key_template = {dir}/{org_id}/{name}
