# =============================================================================
# CodeBuild: sap-bank-clearing-api (us-east-1)
#   1. Check the Python sources compile
#   2. Package the source as a tar.gz bundle and upload it to S3
#   3. Deploy via SSM Run Command: the EC2 host downloads the bundle,
#      runs `docker build` and restarts the container (deploy/deploy.sh)
#
# No ECR and no privileged mode needed: the image is built on the EC2 host.
# Override any variable below in the CodeBuild project's environment settings.
# =============================================================================
version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    APP_NAME: "sap-bank-clearing-api"
    # Bucket for build bundles (CodeBuild role can already write codepipeline-us-east-1-*)
    BUNDLE_BUCKET: "codepipeline-us-east-1-922151790333"
    BUNDLE_PREFIX: "sap-bank-clearing-api/releases"
    # Target EC2 instance(s), comma-separated (development host)
    DEPLOY_INSTANCE_IDS: "i-019cd9689708261b3"
    # Set to "false" to only package + upload (no EC2 deploy)
    DEPLOY_ENABLED: "true"
    HOST_PORT: "8000"
    # URL prefix nginx serves the API under (https://demo.datatwin.ai/sap/bank)
    ROOT_PATH: "/sap/bank"
    CONFIG_PARAM: "/sap-bank-clearing-api/config.ini"
    DEPLOY_TIMEOUT_SECONDS: "900"

phases:
  pre_build:
    commands:
      - COMMIT_TAG=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}" | cut -c1-7)
      - RELEASE="${COMMIT_TAG}-${CODEBUILD_BUILD_NUMBER:-0}"
      - BUNDLE_URI="s3://${BUNDLE_BUCKET}/${BUNDLE_PREFIX}/${RELEASE}.tar.gz"
      - echo "Release ${RELEASE} -> ${BUNDLE_URI}"
      - python3 -m py_compile main.py api.py logger_setup.py db_manager.py sap_odata_extractor.py bank_posting/*.py

  build:
    commands:
      - |
        tar -czf "/tmp/${RELEASE}.tar.gz" \
          Dockerfile .dockerignore requirements.txt \
          main.py api.py logger_setup.py db_manager.py sap_odata_extractor.py \
          bank_posting deploy/deploy.sh
      - ls -lh "/tmp/${RELEASE}.tar.gz"
      - aws s3 cp "/tmp/${RELEASE}.tar.gz" "$BUNDLE_URI" --sse aws:kms --only-show-errors

  post_build:
    commands:
      # post_build runs even when build fails; stop here in that case
      - '[ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ] || { echo "Build failed - skipping deploy"; exit 1; }'
      - |
        if [ "$DEPLOY_ENABLED" != "true" ]; then
          echo "DEPLOY_ENABLED=$DEPLOY_ENABLED - skipping EC2 deployment"
          exit 0
        fi
        set -e
        # deploy.sh is sent inline so the host always runs the matching version
        SCRIPT_B64=$(base64 -w0 deploy/deploy.sh)
        CMD="echo ${SCRIPT_B64} | base64 -d > /tmp/${APP_NAME}-deploy.sh && APP_NAME=${APP_NAME} HOST_PORT=${HOST_PORT} ROOT_PATH=${ROOT_PATH} CONFIG_PARAM=${CONFIG_PARAM} bash /tmp/${APP_NAME}-deploy.sh ${BUNDLE_URI} ${RELEASE} ${AWS_DEFAULT_REGION}"
        python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]],"executionTimeout":[sys.argv[2]]}))' \
          "$CMD" "$DEPLOY_TIMEOUT_SECONDS" > ssm-params.json

        COMMAND_ID=$(aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --comment "${APP_NAME} ${RELEASE}" \
          --targets "Key=InstanceIds,Values=${DEPLOY_INSTANCE_IDS}" \
          --parameters file://ssm-params.json \
          --timeout-seconds 120 \
          --query Command.CommandId --output text)
        echo "SSM command: $COMMAND_ID"

        # Wait for all targeted instances to finish
        END=$(( $(date +%s) + DEPLOY_TIMEOUT_SECONDS + 60 ))
        while :; do
          sleep 10
          STATUSES=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" \
            --query "CommandInvocations[].Status" --output text)
          echo "Invocation status: ${STATUSES:-<pending>}"
          if [ -n "$STATUSES" ] && ! echo "$STATUSES" | grep -qE "Pending|InProgress|Delayed"; then break; fi
          [ "$(date +%s)" -gt "$END" ] && { echo "Timed out waiting for SSM"; exit 1; }
        done

        # Print each host's output, fail the build if any host failed
        aws ssm list-command-invocations --command-id "$COMMAND_ID" --details \
          --query "CommandInvocations[].{instance:InstanceId,status:Status,output:CommandPlugins[0].Output}" \
          --output text
        [ -z "$(echo "$STATUSES" | tr '\t' '\n' | grep -v '^Success$')" ] || { echo "Deployment failed on at least one instance"; exit 1; }
        echo "Deployed release ${RELEASE} to ${DEPLOY_INSTANCE_IDS}"
