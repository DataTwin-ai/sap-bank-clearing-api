; Sync settings used when the SAP sync runs inside the sap-bank-clearing-api container
; (sap_sync_scheduler.py, every minute). No secrets in this file: it is part of the image.
; The DB / SAP connection, passwords, [environment] and [defaults] (tenant_id, org_id) come from
; the bank API's config.ini (/app/config.ini), which is read after this file and wins.
; Keep comments on their own lines.

[sync]
; DataTwin org of the SAP data: sent to ingestion and part of every new passportid
; (PPSAP<last 2 digits>...). Overrides the bank API's own [defaults] org_id for the sync only.
org_id = OM0000000002

[delta]
; Ingested in this order each cycle: keep a header table (VBRK) before its items (VBRP).
tables = BSID, BSAD, VBRK, VBRP
poll_seconds = 60
missing_polls_before_removed = 2
passport_prefix = PPSAP

[ingestion]
enabled = true
base_url = https://lv.datatwin.ai/data-model-ingestion
db =
batch_size = 5000
job_poll_seconds = 10
job_timeout_minutes = 30
request_timeout = 120
max_retries = 3
process_code_bsid = BT3H
transaction_type_bsid = Invoice
theme_name_bsid = SAP_BSID_INV
columns_bsid = bukrs, kunnr, belnr, gjahr, buzei, blart, bldat, budat, cpudt, xblnr, zuonr, waers, dmbtr, wrbtr, shkzg, zfbdt, zterm, zbd1t, sgtxt, xref1, xref2, xref3, augdt, augbl, gsber, hkont, mwskz
; Columns added to the staged rows for the AR Inbox (deploy/sql/sap_ar_inbox_fields.sql maps them):
; doc_ref (XBLNR else BELNR), customer_name (KNA1), local_currency (T001), tds_value / adjusted_amount = 0
enrich_bsid = doc_ref, customer_name, local_currency, zero_tds
process_code_bsad = BT3H
transaction_type_bsad = CUSTOMER_ACCOUNT
theme_name_bsad = SAP_BSAD_CA
columns_bsad = bukrs, kunnr, belnr, gjahr, buzei, blart, bldat, budat, cpudt, xblnr, zuonr, waers, dmbtr, wrbtr, shkzg, zfbdt, zterm, zbd1t, sgtxt, xref1, xref2, xref3, augdt, augbl, gsber, hkont, mwskz
enrich_bsad = doc_ref, customer_name, local_currency, zero_tds
process_code_vbrk = BT3H
transaction_type_vbrk = SalesInvoice
theme_name_vbrk = SAP_VBRK_SI
columns_vbrk = vbeln, fkart, fkdat, bukrs, gjahr, belnr, xblnr, kunag, kunrg, vkorg, vtweg, waerk, kurrf, netwr, mwsbk, zterm, rfbsk, fksto, sfakn
process_code_vbrp = BT3I
transaction_type_vbrp = SalesInvoice
theme_name_vbrp = SAP_VBRP_SI
columns_vbrp = vbeln, posnr, fkdat_ana as fkdat, bukrs_ana as bukrs, kunrg_ana as kunrg, kunag_ana as kunag, matnr, arktx, matkl, fkimg, vrkme, netwr, mwsbp, mwsk1, waerk, werks, aubel, aupos, vgbel, vgpos, pstyv, shkzg

[paths]
; relative to the sync folder (/app/sap_sync) -> /app/log/sap_sync and /app/data/sap_sync,
; which are the host's bind-mounted log/ and data/ folders (kept across deployments)
log_dir = ../log/sap_sync
data_dir = ../data/sap_sync

[logging]
level = INFO
log_to_file = true
retention_days = 30
